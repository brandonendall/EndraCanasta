name: Android Prototype APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create platform scaffolding
        run: flutter create --platforms=android,ios --org com.endra.prototype .
      - name: Get dependencies
        run: flutter pub get
      - name: Generate Endra Canasta launcher icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EndraCanasta-Prototype-0.1-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
