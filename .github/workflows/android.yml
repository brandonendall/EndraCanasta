name: Android Prototype APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create platform scaffolding
        run: flutter create --platforms=android,ios --org com.endra.prototype .
      - name: Apply Endra Canasta launcher icon
        run: |
          for d in android/app/src/main/res/mipmap-*dpi; do
            rm -f "$d/ic_launcher.png"
            cp assets/app_icon.jpg "$d/ic_launcher.jpg"
          done

      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EndraCanasta-Prototype-0.1-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
